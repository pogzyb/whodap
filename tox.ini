[tox]
envlist = 3.10, 3.11, 3.12, 3.13 ,3.14
minversion = 3.10.0
isolated_build = true

[gh-actions]
python =
    3.10: 3.10
    3.11: 3.11
    3.12: 3.12
    3.13: 3.13
    3.14: 3.14

[testenv]
deps =
    pytest == 9.0.3
    pytest-cov == 7.1.0
    pytest-mock == 3.15.1
    pytest-asyncio == 1.3.0

commands =
    pytest --cov-report xml --cov={envsitepackagesdir}/whodap
